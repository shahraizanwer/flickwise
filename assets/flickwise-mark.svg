  <!-- flick streaks -->
  <g stroke="#000" stroke-width="44" stroke-linecap="round" fill="none">
    <line x1="648" y1="232" x2="712" y2="168"/>
    <line x1="722" y1="306" x2="822" y2="206"/>
    <line x1="796" y1="380" x2="860" y2="316"/>
  </g>

  <!-- ink check -->
  <path fill="#000" mask="url(#gap)"
        d="M 326 704
           C 352 734 378 760 398 778
           C 404 783 410 783 416 779
           L 742 590
           C 756 582 768 600 756 610
           L 432 826
