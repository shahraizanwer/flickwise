      <circle cx="0" cy="-30" r="38" fill="#000"/>
      <rect x="-12" y="-30" width="24" height="300" fill="#000"/>
    </mask>
    <mask id="gap">
      <rect x="0" y="0" width="1024" height="1024" fill="#fff"/>
      <g transform="translate(500 530) rotate(45)">
        <path d="M -135 -150 C -140 -20 -60 110 0 250 C 60 110 140 -20 135 -150 Q 0 -215 -135 -150 Z" fill="#000" stroke="#000" stroke-width="44"/>
